<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Macro Editor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
                background: #0e0e12; }
    body { display: flex; }
    #blocklyWrap { position: relative; flex: 1; height: 100%; min-width: 0; z-index: 0; }
    #blockly-div { position: absolute; inset: 0; }
    /* ── local variables rail — 1:1 with the procedures editor ── */
    #localVars {
      position: relative; z-index: 2;
      width: 200px; flex-shrink: 0; height: 100%;
      background: #121218; border-left: 1px solid #2a2a35;
      display: flex; flex-direction: column;
    }
    #localVars h3 {
      margin: 0; padding: 10px 10px 6px;
      font-size: 10px; letter-spacing: .8px; text-transform: uppercase;
      color: #7070a0; font-weight: 800;
    }
    #localVars .lv-btns { display: flex; gap: 6px; padding: 0 10px 10px; }
    #localVars .lv-btns button {
      flex: 1; background: #1a1a24; border: 1px solid #2a2a35; color: #e0e0e8;
      border-radius: 6px; padding: 6px 8px; font-size: 12px; cursor: pointer; font-weight: 700;
    }
    #localVars .lv-btns button:hover { border-color: #7c6af7; }
    #localVars .lv-list { flex: 1; overflow: auto; padding: 0 8px 8px; }
    #localVars .lv-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 8px; border-radius: 6px; color: #e0e0e8; font-size: 12px; cursor: pointer;
    }
    #localVars .lv-item:hover, #localVars .lv-item.sel { background: rgba(124,106,247,.12); }
    #localVars .lv-item .t { color: #7070a0; font-size: 10px; text-transform: uppercase; }
    #localVars .lv-hint { color: #7070a0; font-size: 10px; margin: 0 0 8px; user-select: none; }
    #lvDialog {
      display: none; position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.45); align-items: center; justify-content: center;
    }
    #lvDialog.open { display: flex; }
    #lvDialog .box {
      width: 280px; background: #16161c; border: 1px solid #2a2a35; border-radius: 10px; padding: 16px;
    }
    #lvDialog h4 { margin: 0 0 12px; color: #e0e0e8; font-size: 13px; }
    #lvDialog label { display: block; font-size: 11px; color: #7070a0; margin: 8px 0 4px; }
    #lvDialog input, #lvDialog select {
      width: 100%; height: 32px; background: #0e0e12; border: 1px solid #2a2a35;
      border-radius: 6px; color: #e0e0e8; padding: 0 8px;
    }
    #lvDialog .row { display: flex; gap: 8px; margin-top: 14px; }
    #lvDialog .row button {
      flex: 1; height: 32px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px;
    }
    #lvDialog .ok { background: #7c6af7; border: 0; color: #fff; }
    #lvDialog .no { background: transparent; border: 1px solid #2a2a35; color: #e0e0e8; }
    /* 1:1 with the procedures editor's toolbox strip (blockly_editor.html) */
    .blocklyToolboxDiv {
      width: 168px !important;
      display: flex !important;
      flex-direction: column !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
    }
    .blocklyToolboxDiv > .blocklyToolboxContents {
      flex-wrap: nowrap !important;
      margin-top: auto !important;   /* bottom-anchor; scroll-safe */
      flex-shrink: 0 !important;
    }
    .blocklyToolboxCategory {
      padding: 3px 8px !important;
      flex-shrink: 0 !important;
    }
    .blocklyTreeRow { flex-shrink: 0 !important; }
    .blocklyToolboxCategory .blocklyToolboxCategory .blocklyTreeRow {
      padding-left: 14px !important;
    }
    ::-webkit-scrollbar { width: 7px; }
    .blocklyScrollbarBackground { opacity: 255; fill: transparent; }
    .blocklyMainBackground { stroke-width: 0; }
    .blocklyFlyoutBackground { fill-opacity: 0; }

    /* Z-fix: category flyout blocks must paint ABOVE the group/studio
       popup (z 60) so they stay visible wherever they overlap it —
       while staying below the toolbox (70) and the drag surface (80,
       dragged-block ghost floats over everything). Stack, bottom→top:
       main canvas < popup(60) < flyout(65) < toolbox(70) < drag(80). */
    #blocklyWrap .blocklyFlyout { z-index: 65; }
    #blocklyWrap .blocklyFlyoutScrollbar { z-index: 66; }
    #mfm-pop { position: fixed; inset: 0; background: rgba(14,14,18,.55);
               z-index: 9990; display: none; align-items: center;
               justify-content: center; }
    .mfm-pop-panel { width: min(420px, 92vw); background: #16161c;
                     border: 1px solid #2a2a35; border-radius: 10px;
                     padding: 16px; color: #e0e0e8;
                     font: 13px/1.5 IBM Plex Sans, sans-serif; }
    .mfm-pop-panel h3 { margin: 0 0 8px; font-size: 15px; }
    .mfm-pop-panel p { margin: 0 0 10px; color: #a0a0b0; }
    .mfm-pop-status { min-height: 18px; color: #7070a0; margin-bottom: 12px; }
    .mfm-pop-status.ok { color: #9585ff; }
    .mfm-pop-status.err { color: #e05a5a; }
    #mfm-pop-cancel, .mfm-shot-bar button { height: 34px; padding: 0 16px;
      border: 1px solid #2a2a35; background: #1c1c26; color: #e0e0e8;
      border-radius: 7px; cursor: pointer; }
    .mfm-shot-bar button.primary { background: #7c6af7; border-color: #7c6af7;
      color: #fff; font-weight: 700; }
    #mfm-shot { position: fixed; inset: 0; z-index: 9995; background: #0b0b10;
                overflow: hidden; }
    #mfm-shot img { position: absolute; user-select: none;
                    -webkit-user-drag: none; cursor: crosshair; }
    #mfm-shot-sel { position: absolute; width: 3px; height: 3px;
                    background: #7c6af7; outline: 1px solid #fff;
                    display: none; pointer-events: none; }
    .mfm-shot-bar { position: fixed; left: 0; right: 0; bottom: 0; height: 44px;
                    display: flex; align-items: center; gap: 14px; padding: 0 16px;
                    background: #16161c; border-top: 1px solid #2a2a35;
                    color: #e0e0e8; font: 13px IBM Plex Sans, sans-serif;
                    z-index: 9996; }
    .mfm-hint { color: #a0a0b0; }
    .mfm-coords { color: #9585ff; font-weight: 700; }
    #mfm-toast { position: fixed; right: 18px; bottom: 62px;
                 background: #16161c; border: 1px solid #7c6af7;
                 color: #e0e0e8; border-radius: 8px; padding: 10px 14px;
                 font: 13px IBM Plex Sans, sans-serif; z-index: 9999; }
    /* dark chrome for blockly widgets (input editors, dropdowns, menus) */
    .blocklyHtmlInput {
      background: #16161c !important; color: #e0e0e8 !important;
      border: 1px solid #7c6af7 !important; caret-color: #7c6af7;
      font: 12px 'Segoe UI', sans-serif;
    }
    .blocklyDropDownDiv { background: #16161c !important; border-color: #2a2a35 !important; color: #e0e0e8; }
    .blocklyDropDownDiv .blocklyMenuItem { color: #e0e0e8 !important; background: transparent; }
    .blocklyDropDownDiv .blocklyMenuItem:hover { background: rgba(124,106,247,.18) !important; }
    .blocklyWidgetDiv .blocklyMenu { background: #16161c !important; border-color: #2a2a35 !important; color: #e0e0e8; }
    .blocklyWidgetDiv .blocklyMenuItem { color: #e0e0e8 !important; }
    .blocklyWidgetDiv .blocklyMenuItemHighlight { background: rgba(124,106,247,.18) !important; }
    .blocklyWidgetDiv .blocklyMenuItemDisabled { color: #7070a0 !important; }
    .blocklyTooltipDiv { background: #16161c !important; border: 1px solid #2a2a35 !important; color: #a0a0b0 !important; }
  
  /* ── Group popup — mutator-style bubble (bigger) ─────────────────────── */
  /* mutator-style window: plain workspace + close X top-right + a thin
     drag strip on the top edge; no title bar, no Done/Cancel — edits are
     live, the group block on the canvas updates as you edit. */
  #mfmGroupBubble {
    position: absolute; z-index: 60; display: none;
    flex-direction: column;
    background: rgba(30, 30, 38, .98);
    border: 1.5px solid #5b80a5;            /* the mutator bubble border tone */
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(91,128,165,.25), 0 10px 44px rgba(0,0,0,.55);
    overflow: visible;                      /* the tail pokes out */
  }
  #mfmGroupBubble.open { display: flex; }
  #mfmGroupBubble .gb-drag {
    position: absolute; top: 0; left: 26px; right: 26px; height: 14px;
    cursor: move; z-index: 3;
  }
  #mfmGroupBubble .gb-close {
    position: absolute; top: 3px; right: 4px; z-index: 4;
    background: none; border: none; color: #9a96b8;
    font: 14px/1 system-ui, sans-serif; cursor: pointer; padding: 3px 7px; border-radius: 4px;
  }
  #mfmGroupBubble .gb-close:hover { color: #fff; background: rgba(255,255,255,.08); }
  #mfmGroupBubble .gb-ws { flex: 1; min-height: 0; border-radius: 7px; overflow: hidden; }
  #mfmGroupBubble .gb-ws .injectionDiv { height: 100%; }
  /* resize grips — thin invisible strips on all edges/corners */
  #mfmGroupBubble .gb-rz { position: absolute; z-index: 6; }
  #mfmGroupBubble .gb-rz-n { top: -3px; left: 12px; right: 12px; height: 7px; cursor: n-resize; }
  #mfmGroupBubble .gb-rz-s { bottom: -3px; left: 12px; right: 12px; height: 7px; cursor: s-resize; }
  #mfmGroupBubble .gb-rz-w { left: -3px; top: 12px; bottom: 12px; width: 7px; cursor: w-resize; }
  #mfmGroupBubble .gb-rz-e { right: -3px; top: 12px; bottom: 12px; width: 7px; cursor: e-resize; }
  #mfmGroupBubble .gb-rz-nw { top: -4px; left: -4px; width: 14px; height: 14px; cursor: nw-resize; }
  #mfmGroupBubble .gb-rz-ne { top: -4px; right: -4px; width: 14px; height: 14px; cursor: ne-resize; }
  #mfmGroupBubble .gb-rz-sw { bottom: -4px; left: -4px; width: 14px; height: 14px; cursor: sw-resize; }
  #mfmGroupBubble .gb-rz-se { bottom: -4px; right: -4px; width: 16px; height: 16px; cursor: se-resize; }
  #mfmGroupBubble .gb-rz:hover, #mfmGroupBubble .gb-rz.active {
    background: rgba(124,106,247,.35); border-radius: 3px;
  }
  #mfmGroupBubble .gb-loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(18,18,26,.85); color: #9a96b8; z-index: 5;
    font: 500 13px system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
  <div id="blocklyWrap">
    <div id="blockly-div"></div>
    <div id="mfmGroupBubble">
      <div class="gb-drag" id="gbDrag" title="Drag to move the window"></div>
      <button type="button" class="gb-close" id="gbClose" title="Close">&#10005;</button>
      <div class="gb-ws" id="gbWs"></div>
      <div class="gb-rz gb-rz-n" data-d="n"></div>
      <div class="gb-rz gb-rz-s" data-d="s"></div>
      <div class="gb-rz gb-rz-w" data-d="w"></div>
      <div class="gb-rz gb-rz-e" data-d="e"></div>
      <div class="gb-rz gb-rz-nw" data-d="nw"></div>
      <div class="gb-rz gb-rz-ne" data-d="ne"></div>
      <div class="gb-rz gb-rz-sw" data-d="sw"></div>
      <div class="gb-rz gb-rz-se" data-d="se"></div>
      <div class="gb-loading" id="gbLoading" style="display:none">building blocks&hellip;</div>
    </div>
  </div>



  <xml id="mfm-toolbox" style="display:none">
    <!-- MACROS STAY CHEAP: record them or build them by hand. A lean
         Mouse / Keyboard set, plus Flow — nothing else; heavy lifting
         belongs to modes / flows / procedures. -->
    <category name="Mouse" colour="40">
      <block type="mfm_scaled_move">
        <value name="POINT"><block type="pcr_point_xy">
          <value name="X"><block type="math_number"><field name="NUM">0</field></block></value>
          <value name="Y"><block type="math_number"><field name="NUM">0</field></block></value>
        </block></value>
      </block>
      <block type="mfm_abs_move">
        <value name="POINT"><block type="pcr_point_xy">
          <value name="X"><block type="math_number"><field name="NUM">0</field></block></value>
          <value name="Y"><block type="math_number"><field name="NUM">0</field></block></value>
        </block></value>
      </block>
      <block type="mfm_click">
        <value name="BUTTON"><block type="pcr_mouse"><field name="BUTTON">left</field></block></value>
      </block>
      <block type="mfm_mouse_down">
        <value name="BUTTON"><block type="pcr_mouse"><field name="BUTTON">left</field></block></value>
      </block>
      <block type="mfm_mouse_up">
        <value name="BUTTON"><block type="pcr_mouse"><field name="BUTTON">left</field></block></value>
      </block>
    </category>
    <category name="Keyboard" colour="40">
      <block type="mfm_press_key">
        <value name="KEY"><block type="pcr_key"><field name="KEY">space</field></block></value>
      </block>
      <block type="mfm_key_down">
        <value name="KEY"><block type="pcr_key"><field name="KEY">space</field></block></value>
      </block>
      <block type="mfm_key_up">
        <value name="KEY"><block type="pcr_key"><field name="KEY">space</field></block></value>
      </block>
    </category>
    <sep></sep>
    <category name="Flow" colour="120">
      <block type="mfm_delay">
        <value name="MS"><block type="math_number"><field name="NUM">100</field></block></value>
      </block>
      <block type="mfm_label"></block>
      <block type="mfm_goto"></block>
      <block type="mfm_lock"></block>
      <block type="mfm_group"></block>
      <block type="mfm_section"></block>
      <block type="mfm_comment"></block>
      <block type="mfm_play_macro">
        <value name="PATH"><block type="text"><field name="TEXT">other.macro</field></block></value>
      </block>
    </category>
  </xml>

  <script src="/blockly/lib/blockly.min.js"></script>
  <script src="/blockly/lib/blockly_action_icons.js"></script>
  <script src="/blockly/lib/python_compressed.js"></script>
  <script src="/blockly/lib/en.js"></script>
  <script src="/blockly/lib/mf-keys.js"></script>
  <script src="/editor/mf-plugins.js"></script>
  <script src="/editor/macro-blocks.js?v=216"></script>
  <script src="/editor/macro-picker.js"></script>
  <script>
  (function () {
    'use strict';
    try {
      Blockly.utils.colour.setHsvSaturation(0.55);
      Blockly.utils.colour.setHsvValue(0.70);
    } catch (e) {}

    function buildDarkTheme() {
      try {
        return new Blockly.Theme('mf_dark', {
          math_blocks: { colourPrimary: '#5060b2' },
          text_blocks: { colourPrimary: '#50b291' },
          logic_blocks: { colourPrimary: '#5081b2' },
          list_blocks: { colourPrimary: '#7150b2' },
          loop_blocks: { colourPrimary: '#50b250' },
          variable_blocks: { colourPrimary: '#b25081' }
        }, {}, {
          workspaceBackgroundColour: '#0e0e12',
          toolboxBackgroundColour: '#16161c',
          toolboxForegroundColour: '#e0e0e8',
          flyoutBackgroundColour: '#12121a',
          flyoutForegroundColour: '#e0e0e8',
          flyoutOpacity: 1,
          scrollbarColour: '#2a2a35',
          scrollbarOpacity: 0.9,
          insertionMarkerColour: '#7c6af7',
          insertionMarkerOpacity: 0.4,
          cursorColour: '#7c6af7'
        });
      } catch (e) { return undefined; }
    }

    var ws = null;
    var loading = false;
    var pushTimer = null;
    var pushAllowed = false;   // false until the first real load finishes — hat-create must not wipe

    function send(msg) {
      try { window.parent.postMessage(msg, '*'); } catch (e) {}
    }

    function schedulePush() {
      if (loading || !pushAllowed || !ws) return;
      if (pushTimer) clearTimeout(pushTimer);
      pushTimer = setTimeout(function () {
        pushTimer = null;
        if (loading || !pushAllowed || !ws) return;
        try {
          // blockly rides along with the steps so the host can embed the
          // exact workspace in the .macro file (layout, arrangement,
          // group data) — steps stay authoritative for the engine
          // blocklyXml: the exact workspace as XML — v3 containers store
          // it 1:1 (layout, strays, groups, mutators); JSON rides along
          // for legacy state
          send({ type: 'mfm-changed', blocks: mfmWorkspaceToList(ws),
                 blockly: mfmWorkspaceToJson(ws), blocklyXml: mfmWorkspaceToXml(ws) });
        } catch (e) {}
      }, 250);
    }

    // ── viewport culling (per-workspace, cached-index fast path) ────────
    // Thousands of recorded moves render as thousands of SVG groups; the
    // browser paints ALL of them even off-screen. Culling toggles
    // display:none on blocks outside the visible window (expanded by one
    // extra viewport each side), leaving the Blockly model untouched —
    // connections, fields and serialization all keep working.
    // FAST PATH: each frame walks a CACHED index tree (post-order node
    // array with absolute positions + parent/kid links). getChildren()
    // allocations — the expensive part of the old pass — happen only when
    // the index is REBUILT (create/delete/move/change/load). Scrolling
    // and zooming just re-walk the cache: tight arithmetic, ~1ms at 20k
    // blocks, which is what fixes 'laggy when just moving around'.
    function MfmCull(ws) {
      this.ws = ws;
      this.hidden = {};
      this.dragging = false; this.dragSet = {};
      this.loading = false;
      this.idxDirty = true; this.passDirty = true;
      this.lastCX = 1e9; this.lastCY = 1e9; this.lastSc = 0;
      this.nodes = [];              // post-order: kids always before parents
      this.flatRecs = [];           // restore info for flattened chain members
      this._changeTimer = null;
      this.onAnyChange = null;
    }
    MfmCull.prototype.soon = function () { this.passDirty = true; };
    MfmCull.prototype.indexSoon = function () { this.idxDirty = true; this.passDirty = true; };
    MfmCull.prototype.indexSoonDebounced = function () {
      var self = this;
      if (self._changeTimer) return;
      self._changeTimer = setTimeout(function () { self._changeTimer = null; self.indexSoon(); }, 200);
    };
    // block's translate offset relative to its svg parent, parsed from the
    // g's transform attribute; null = unparseable → keep the block visible
    MfmCull.prototype.blockOffset = function (b) {
      var root = b.getSvgRoot();
      if (!root) return { x: 0, y: 0 };
      var t = root.getAttribute('transform');
      if (!t) return { x: 0, y: 0 };
      var m = /^translate\(\s*(-?[\d.]+)\s*,\s*(-?[\d.]+)/.exec(t);
      return m ? { x: parseFloat(m[1]), y: parseFloat(m[2]) } : null;
    };
    // ── chain flattening ─────────────────────────────────────────────
    // Blockly nests each next-block's svg root INSIDE the previous
    // block's svg group, so a long vertical chain is one deeply nested
    // tree: a visible block forces every block ABOVE it to stay
    // rendered (they're its svg ancestors), and every display toggle
    // re-lays out the whole nest. The cull could only trim the tail —
    // scroll to step 700 of 800 and ~700 nested groups repaint per pan
    // frame. That's why the group window lagged vertically: the chain
    // is narrow, so horizontal panning never brings new blocks into
    // the band (zero toggles, smooth), while vertical panning unhides
    // tail blocks every frame (full relayout, jank).
    // Fix: for chains >= FLATTEN_MIN we MOVE each member's svg root
    // out of its parent's group onto the block canvas itself, with an
    // ABSOLUTE translate. The blocks stay connected in the block model
    // (serialization, connects, drags all unchanged) but svg-wise every
    // member is its own top-level group — so the cull can hide the
    // prefix, and a toggle relayouts ~a viewport of blocks, not ~800.
    // A drag start re-nests everything (Blockly drags the head's svg
    // root with descendants inside it); the first rebuild after the
    // drop re-flattens.
    var FLATTEN_MIN = 60;
    MfmCull.prototype._canvas = function () {
      try { return (this.ws && this.ws.getCanvas) ? this.ws.getCanvas() : null; }
      catch (e) { return null; }
    };
    MfmCull.prototype.flattenChains = function () {
      var ws = this.ws;
      if (!ws || this.dragging) return;   // never while a drag owns the svg
      var canvas = this._canvas();
      if (!canvas) return;
      var self = this;
      var bo = function (b) { return self.blockOffset(b); };
      var tops;
      try { tops = ws.getTopBlocks(false); } catch (e) { return; }
      for (var t = 0; t < tops.length; t++) {
        var top = tops[t];
        var to = bo(top);
        if (!to) continue;
        // chain heads: the top itself AND its statement-input children
        // (the popup's / the canvas' main chain hangs off the hat's DO
        // input, not a next connection — walking only tops would miss it)
        var heads = [{ b: top, x: to.x, y: to.y }];
        try {
          var il = top.inputList || [];
          for (var ii = 0; ii < il.length; ii++) {
            var conn = il[ii] && il[ii].connection;
            var tgt = conn && conn.targetBlock ? conn.targetBlock() : null;
            if (!tgt) continue;
            var ho = bo(tgt);
            if (ho) heads.push({ b: tgt, x: to.x + ho.x, y: to.y + ho.y });
          }
        } catch (e) {}
        for (var hh = 0; hh < heads.length; hh++) {
          this._flattenChain(heads[hh], canvas, bo);
        }
      }
    };
    // walk one head's next-chain (absolute positions accumulated) and
    // detach long chains' members onto the canvas
    MfmCull.prototype._flattenChain = function (head, canvas, bo) {
      var ws = this.ws;
      // the ORIGINAL relative offset of every already-flat member: its svg
      // transform is absolute now, so re-walking must not re-add it
      var recById = {};
      for (var r = 0; r < this.flatRecs.length; r++) recById[this.flatRecs[r].id] = this.flatRecs[r];
      var members = [], cur = head.b, cx = head.x, cy = head.y;
      for (;;) {
        members.push({ b: cur, x: cx, y: cy });
        var nx = cur.getNextBlock ? cur.getNextBlock() : null;
        if (!nx) break;
        var ko = (nx.mfmFlat && recById[nx.id])
          ? { x: recById[nx.id].relX, y: recById[nx.id].relY }
          : bo(nx);                       // nested → transform is relative
        if (!ko) break;
        cx += ko.x; cy += ko.y;
        cur = nx;
      }
      if (members.length < FLATTEN_MIN) return;
      for (var i = 1; i < members.length; i++) {
        var m = members[i].b;
        if (m && m.mfmFlat) {
          // already flattened: keep the absolute transform in sync —
          // moveBy/cleanUp only repositions the head, Blockly never
          // touches mid-chain roots, so we follow it here
          try {
            var r2 = m.getSvgRoot && m.getSvgRoot();
            var want = 'translate(' + members[i].x + ', ' + members[i].y + ')';
            if (r2 && r2.parentNode === canvas && r2.getAttribute('transform') !== want) {
              r2.setAttribute('transform', want);
            }
          } catch (e) {}
          continue;
        }
        if (!m) continue;
        if (!ws.getBlockById(m.id)) continue;          // stale block
        var root = m.getSvgRoot && m.getSvgRoot();
        if (!root || root.parentNode === canvas) continue;
        var rel = bo(m);                              // current transform (relative to parent's g)

            pushAllowed = true;
            send({ type: 'mfm-loaded' });
            return;
          }
          try { console.warn('mfm blockly-xml was hat-only — rebuilding from steps'); } catch (e2) {}
          loading = true;
          pushAllowed = false;
        } catch (e) { try { console.warn('mfm blockly-xml load failed — rebuilding from steps', e); } catch (e2) {} }
      }
      if (blockly && typeof blockly === 'object' && blockly.blocks) {
        try {
          _mfmRegisterGhostsJson(blockly.blocks.blocks || []);
          loadBlocklyWorkspace(blockly, name);
          if (_mfmHatHasBody() || !(blocks || []).length) {
            pushAllowed = true;
            send({ type: 'mfm-loaded' });
            return;
          }
          try { console.warn('mfm blockly-json was hat-only — rebuilding from steps'); } catch (e2) {}
          loading = true;
          pushAllowed = false;
        } catch (e) { try { console.warn('mfm blockly-json load failed — rebuilding from steps', e); } catch (e2) {} }
      }

      var _t0 = Date.now(), _tp = _t0;
      function _phase(tag) {
        try { console.info('MFMPHASE ' + tag + ' ' + (Date.now() - _tp) + 'ms'); _tp = Date.now(); } catch (e) {}
      }
      loading = true;
      if (mainCull) mainCull.markAll(true);
      try {
        Blockly.Events.disable();
        try { ws.setResizesEnabled(false); } catch (e2) {}
        ws.clear();
        // hat = entry point: created FIRST so a bad line in the .macro list
        // can never leave the workspace hatless again
        var hat = mfmEnsureHat(ws, name || '');
        _phase('clear+hat');
        var r = mfmListToXml(blocks || []);
        _phase('listToXml');
        _mfmRegisterGhostsXml([r.dom]);
        Blockly.Xml.domToWorkspace(r.dom, ws);
        _phase('domToWorkspace');
        // wire every loose top stack under the hat in order
        var prevTail = null;
        var tops = ws.getTopBlocks(true).filter(function (b) { return b.type !== 'mfm_hat'; });
        tops.forEach(function (head) {
          if (prevTail) {
            try { prevTail.nextConnection.connect(head.previousConnection); }
            catch (e) { prevTail = null; }
          } else if (hat.getInputTargetBlock('DO') == null) {
            try { hat.getInput('DO').connection.connect(head.previousConnection); }
            catch (e) {}
          }
          var t = head;
          while (t && t.getNextBlock()) t = t.getNextBlock();
          prevTail = t;
        });
        _phase('wire');
        // cleanUp is a full O(n) re-layout; the chain under the hat IS the
        // layout, so skip it for big loads (this alone saves seconds).
        if ((blocks || []).length <= 400) {
          try { ws.cleanUp(); } catch (e3) {}
          _phase('cleanUp');
        }
        // hat centered on X — deferred until layout settles (mid-load the
        // metrics are not real yet, the svg hasn't been resized)
        setTimeout(function () {
          try {
            Blockly.Events.disable();
            try {
              var hm = ws.getMetrics();
              var hvw = (hm && hm.viewWidth ? hm.viewWidth : 800) / (ws.scale || 1);
              var hxx = hat.getRelativeToSurfaceXY().x;
              var hdx = Math.round(hvw / 2 - (hat.width || 160) / 2 - hxx);
              if (hdx) hat.moveBy(hdx, 0);   // the chain follows the hat
            } finally { Blockly.Events.enable(); }
            if (mainCull) mainCull.indexSoon();
          } catch (e4) {}
        }, 60);
        lvRefresh();
        refreshVarDropdowns();
        _phase('post');
        send({ type: 'mfm-loaded' });
      } catch (e) {
        // a broken line must never take the hat or the other blocks with it
        try { console.warn('mfm load error', e); } catch (e2) {}
      } finally {
        try { ws.setResizesEnabled(true); } catch (e2) {}
        try { Blockly.Events.enable(); } catch (e) {}
      }
      loading = false;
      pushAllowed = true;
      if (mainCull) mainCull.markAll(false);
    }

    // ── embedded-workspace load (.macro dual format) ────────────────────
    // Same skeleton as loadBlocks' steps path (cull off → events off →
    // clear → load → refresh → events on), but the workspace JSON is the
    // editor's OWN saved state: coordinates and arrangement load verbatim
    // and NO cleanUp runs — re-layout would destroy the fidelity this
    // path exists for.
    // legacy conversion: macros saved on 2.1.221/2.1.222 may embed the
    // now-removed mfm_while_bg block (the duplicate repeat while/until).
    // Rewrite them to the merged controls_whileUntil — same MODE/BOOL/DO/
    // BACKGROUND inputs, same hasbg mutation — before deserializing.
    function _mfmMigrateWhileBg(node) {
      if (!node || typeof node !== 'object') return;
      if (Array.isArray(node)) { node.forEach(_mfmMigrateWhileBg); return; }
      if (node.type === 'mfm_while_bg') {
        node.type = 'controls_whileUntil';
        try { delete node.fields.REPEATLBL; } catch (e) {}
      }
      if (Array.isArray(node.blocks)) node.blocks.forEach(_mfmMigrateWhileBg);
      if (node.inputs) {
        Object.keys(node.inputs).forEach(function (ik) {
          var iv = node.inputs[ik] || {};
          if (iv.block) _mfmMigrateWhileBg(iv.block);
          if (iv.shadow) _mfmMigrateWhileBg(iv.shadow);
        });
      }
      if (node.next && node.next.block) _mfmMigrateWhileBg(node.next.block);
    }

    function loadBlocklyWorkspace(json, name) {
      loading = true;
      if (mainCull) mainCull.markAll(true);
      try {
        Blockly.Events.disable();
        try { ws.setResizesEnabled(false); } catch (e2) {}
        ws.clear();
        try { _mfmMigrateWhileBg(json && json.blocks); } catch (e1) {}
        Blockly.serialization.workspaces.load(json, ws);
        // safety net: a saved workspace always carries its hat, but a
        // corrupt blob must never leave the canvas hatless
        var hat = null;
        var tops = ws.getTopBlocks(true);
        for (var i = 0; i < tops.length; i++) {
          if (tops[i].type === 'mfm_hat') { hat = tops[i]; break; }
        }
        if (!hat) hat = mfmEnsureHat(ws, name || '');
        if (name) { try { hat.setFieldValue(name, 'NAME'); } catch (e3) {} }
        lvRefresh();
        refreshVarDropdowns();
      } finally {
        try { ws.setResizesEnabled(true); } catch (e2) {}
        try { Blockly.Events.enable(); } catch (e) {}
        loading = false;
        if (mainCull) { mainCull.markAll(false); mainCull.indexSoon(); }
      }
    }

    // ── embedded-workspace load, XML flavor (v3 container blockly.xaml) ──
    // Same fidelity contract as loadBlocklyWorkspace, but the payload is
    // the editor's own workspace XML — layout, strays, groups, mutators,
    // notes all round-trip through Blockly's battle-tested Xml format.
    // legacy conversion (XML flavor): macros saved on 2.1.221/2.1.222 may
    // embed the removed mfm_while_bg block — rewrite before deserializing.
    function _mfmMigrateWhileBgXml(dom) {
      try {
        var bl = dom.getElementsByTagName('block');
        for (var i = 0; i < bl.length; i++) {
          if (bl[i].getAttribute('type') !== 'mfm_while_bg') continue;
          bl[i].setAttribute('type', 'controls_whileUntil');
          var fl = bl[i].getElementsByTagName('field');
          for (var j = fl.length - 1; j >= 0; j--) {
            if (fl[j].getAttribute('name') === 'REPEATLBL' && fl[j].parentNode) {
              fl[j].parentNode.removeChild(fl[j]);
            }
          }
        }
      } catch (e) {}
    }

    function loadBlocklyWorkspaceXml(xmlText, name) {
      loading = true;
      if (mainCull) mainCull.markAll(true);
      try {
        Blockly.Events.disable();
        try { ws.setResizesEnabled(false); } catch (e2) {}
        ws.clear();
        var dom = Blockly.Xml.textToDom(xmlText);
        _mfmRegisterGhostsXml([dom]);       // before deserialize: empty rail must not purge ${var}s
        try { _mfmMigrateWhileBgXml(dom); } catch (e1) {}
        Blockly.Xml.domToWorkspace(dom, ws);
        var hat = null;
        var tops = ws.getTopBlocks(true);
        for (var i = 0; i < tops.length; i++) {
          if (tops[i].type === 'mfm_hat') { hat = tops[i]; break; }
        }
        if (!hat) hat = mfmEnsureHat(ws, name || '');
        if (name) { try { hat.setFieldValue(name, 'NAME'); } catch (e3) {} }
        lvRefresh();
        refreshVarDropdowns();
      } finally {
        try { ws.setResizesEnabled(true); } catch (e2) {}
        try { Blockly.Events.enable(); } catch (e) {}
        loading = false;
        if (mainCull) { mainCull.markAll(false); mainCull.indexSoon(); }
      }
    }
    var _lvSel = null;
    window._pcrLocalVars = window._pcrLocalVars || {};

    // force the typed set/get dropdowns to re-render their options
    function refreshVarDropdowns() {
      if (!ws) return;
      ws.getAllBlocks(false).forEach(function (b) {
        if (b.type.indexOf('pcr_set_') === 0 || b.type.indexOf('pcr_get_') === 0) {
          var f = b.getField('VAR');
          if (f) { try { f.setValue(f.getValue()); } catch (e) {} }
        }
      });
    }

    function lvRefresh() {
      var list = document.getElementById('lvList');
      if (!list || !ws) return;
      var seen = window._pcrLocalVars;
      list.innerHTML = '';
      Object.keys(seen).forEach(function (name) {
        var row = document.createElement('div');
        row.className = 'lv-item' + (_lvSel === name ? ' sel' : '');
        row.innerHTML = '<span>' + name + '</span><span class="t">' + (seen[name] || 'number') + '</span>';
        row.title = 'double-click: jump to the first block using it';
        row.onclick = function () { _lvSel = name; lvRefresh(); };
        row.ondblclick = function () {
          var target = ws.getAllBlocks(false).filter(function (b) {
            return (b.type.indexOf('pcr_set_') === 0 || b.type.indexOf('pcr_get_') === 0)
              && String(b.getFieldValue('VAR') || '') === name;
          })[0];
          if (target && ws.centerOnBlock) { try { ws.centerOnBlock(target.id); } catch (e) {} }
        };
        list.appendChild(row);
      });
      if (_lvSel && !seen[_lvSel]) _lvSel = null;
    }

    if (document.getElementById('lvAdd')) {   // panel removed — macros stay cheap
    document.getElementById('lvAdd').addEventListener('click', function () {
      document.getElementById('lvTitle').textContent = 'New local variable';
      document.getElementById('lvName').value = '';
      document.getElementById('lvType').value = 'number';
      document.getElementById('lvType').disabled = false;
      document.getElementById('lvDialog').classList.add('open');
      document.getElementById('lvName').focus();
    });
    document.getElementById('lvCancel').addEventListener('click', function () {
      document.getElementById('lvType').disabled = false;
      document.getElementById('lvDialog').classList.remove('open');
    });
    document.getElementById('lvOk').addEventListener('click', function () {
      var name = document.getElementById('lvName').value.trim().replace(/\s+/g, '_');
      var vtype = document.getElementById('lvType').value;
      document.getElementById('lvType').disabled = false;
      document.getElementById('lvDialog').classList.remove('open');
      if (!name || !/^[A-Za-z_][A-Za-z0-9_]*$/.test(name)) return;
      window._pcrLocalVars = window._pcrLocalVars || {};
      window._pcrLocalVars[name] = vtype || 'number';
      _lvSel = name;
      lvRefresh();
      refreshVarDropdowns();
      schedulePush();
    });
    document.getElementById('lvDel').addEventListener('click', function () {
      if (!_lvSel) return;
      delete window._pcrLocalVars[_lvSel];
      _lvSel = null;
      lvRefresh();
      refreshVarDropdowns();
      schedulePush();
    });
    }

    var _lastInitJson = null, _lastInitName = null, _lastInitKey = null;
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.type !== 'mfm-init') return;
      // a rebuild is a full clear + recreate of EVERY block — never do it
      // when the payload did not change (list scrolls, selection clicks…).
      // the epoch key covers workspace loads: same steps, fresh workspace.
      var json = null;
      try { json = JSON.stringify(d.blocks || []); } catch (e) {}
      var key = (d.blockly ? 'ws' : 'tx') + ':' + (d.epoch || 0);
      if (json !== null && json === _lastInitJson && d.name === _lastInitName && key === _lastInitKey) return;
      _lastInitJson = json;
      _lastInitName = d.name;
      _lastInitKey = key;
      loadBlocks(d.blocks, d.name, d.blockly, d.blocklyXml);
    });

    // ── boot: editor block defs 1:1 (same source the procedures editor evals) ──
    function startEditor() {
      var injectOptions = {
        toolbox: document.getElementById('mfm-toolbox'),
        trashcan: true,
        zoom: { controls: false, wheel: true, startScale: 0.9, maxScale: 2, minScale: 0.4, scaleSpeed: 1.2 },
        grid: { spacing: 20, length: 3, colour: '#1a1a25', snap: true },
        move: { scrollbars: true, drag: true, wheel: false },
        renderer: 'thrasos',
        media: '/blockly/media/',
      };
      var theme = buildDarkTheme();
      if (theme) injectOptions.theme = theme;
      ws = Blockly.inject('blockly-div', injectOptions);
      window._mfmMainWs = ws;      // debug/smoke-test handle
      mfmEnsureHat(ws, '');

      // Dragging a huge chain (a recorded macro tail can be thousands of
      // blocks) makes the per-mousemove connection-candidate search crawl:
      // it collects every connection of the dragged chain. Past ~400
      // blocks the preview/snap is pointless anyway — skip it.
      var _BD = Blockly.BlockDragger;
      if (_BD && _BD.prototype && !_BD.prototype.__mfmPatched) {
        _BD.prototype.__mfmPatched = true;
        var _mfmOrigStart = _BD.prototype.startDrag;
        _BD.prototype.startDrag = function () {
          try {
            // resolve the dragged block regardless of the argument shape
            var blk = null, a = arguments;
            if (a[0] && a[0].workspace && a[0].getChildren) blk = a[0];
            if (!blk && this.block && this.block.getChildren) blk = this.block;
            if (!blk && this.draggingBlock_) blk = this.draggingBlock_;
            var n = 0;
            if (blk) {
              var st = [blk];
              while (st.length && n <= 401) {
                var x = st.pop(); n++;
                if (x.getNextBlock) { var nx = x.getNextBlock(); if (nx) st.push(nx); }
                var kids = x.getChildren ? x.getChildren(false) : [];
                for (var ci = 0; ci < kids.length; ci++) st.push(kids[ci]);
              }
            }
            this.__mfmBigChain = n > 400;
            var wsc = blk ? blk.workspace : this.workspace;
            this.__mfmNoPreview = this.__mfmBigChain ||
              !!(wsc && wsc.getAllBlocks && wsc.getAllBlocks(false).length > 2500);
            // IMPORTANT: never stub getConnectionCandidate / updateConnectionPreview
            // themselves — Blockly's core only stores the drop target
            // (this.connectionCandidate, read by endDrag to actually connect)
            // INSIDE updateConnectionPreview. A prior version of this patch
            // no-op'd updateConnectionPreview wholesale past the size cutoff,
            // which silently skipped that assignment — big chains (and any
            // drag once the workspace itself was large) would glide right
            // past a wide-open connector and never snap on drop. Instead we
            // only silence the PREVIEWER's own render calls below — the
            // expensive part per the original measurement (queueRender +
            // triggerQueuedRenders building a whole ghost block) — while
            // candidate detection and this.connectionCandidate keep working
            // every frame, so the connect-on-drop still fires.
            var cp = this.connectionPreviewer;
            if (cp && !cp.__mfmPatched) {
              cp.__mfmPatched = true;
              var self = this, origPC = cp.previewConnection, origPR = cp.previewReplacement;
              if (origPC) cp.previewConnection = function (a2, b2) {
                if (self.__mfmNoPreview) return;
                return origPC.call(cp, a2, b2);
              };
              if (origPR) cp.previewReplacement = function (a2, b2, c2) {
                if (self.__mfmNoPreview) return;
                return origPR.call(cp, a2, b2, c2);
              };
            }
          } catch (e) { this.__mfmBigChain = false; this.__mfmNoPreview = false; }
          return _mfmOrigStart.apply(this, arguments);
        };
      }

      mainCull = new MfmCull(ws);
      _culls.push(mainCull);
      mfmBindWs(mainCull);
      mainCull.onAnyChange = function (ev) {
        if (loading || ev.isUiEvent) return;
        schedulePush();
        if (ev.type === 'create' || ev.type === 'delete' || ev.type === 'change') lvRefresh();
      };
      _cullStartLoop();
      send({ type: 'mfm-ready' });
    }

    // ── resolution auto-fill (arrow icon on the ratio/scale blocks) ──
    // 1:1 with the flow editor's MFGet: the ratio block's arrow fills it
    // with the current monitor resolution; the scale block's arrow fills
    // the ratio wired into its DEFAULT socket (creating one if empty).
    function _mfToast(text) {
      var old = document.getElementById('mfm-toast');
      if (old) old.remove();
      var t = document.createElement('div');
      t.id = 'mfm-toast';
      t.textContent = text;
      document.body.appendChild(t);
      setTimeout(function () { t.remove(); }, 2600);
    }

    function _mfSetNum(block, inputName, val) {
      var input = block.getInput(inputName);
      if (!input || !input.connection) return;
      var child = input.connection.targetBlock();
      if (child && child.type === 'math_number') { child.setFieldValue(String(val), 'NUM'); return; }
      if (child) { try { child.unplug(); } catch (e) {} }
      var nb = block.workspace.newBlock('math_number');
      nb.setFieldValue(String(val), 'NUM');
      try { nb.initSvg(); } catch (e) {}
      nb.outputConnection.connect(input.connection);
    }

    window.MFGet = {
      request: function (block, target) {
        if (!block || block.isDeadOrDying()) return;
        fetch('/blockly/screen_info').then(function (r) { return r.json(); }).then(function (d) {
          if (!d || !d.ok) { _mfToast('Could not read screen resolution'); return; }
          var ratio = block;
          if (target === 'default') {
            // scale block: fill the ratio block wired into its DEFAULT socket
            var input = block.getInput('DEFAULT');
            var child = input && input.connection ? input.connection.targetBlock() : null;
            if (child && child.type === 'pcr_res_ratio') {
              ratio = child;
            } else {
              ratio = block.workspace.newBlock('pcr_res_ratio');
              _mfSetNum(ratio, 'RW', 16); _mfSetNum(ratio, 'RH', 9);
              _mfSetNum(ratio, 'DW', 1920); _mfSetNum(ratio, 'DH', 1080);
              try { ratio.initSvg(); } catch (e) {}
              if (input && input.connection) ratio.outputConnection.connect(input.connection);
            }
          }
          _mfSetNum(ratio, 'RW', d.ratio_w);
          _mfSetNum(ratio, 'RH', d.ratio_h);
          _mfSetNum(ratio, 'DW', d.width);
          _mfSetNum(ratio, 'DH', d.height);
          try { ratio.render(); ratio.bumpNeighbours(); } catch (e) {}
          _mfToast('Applied ' + d.width + 'x' + d.height + ' (' + d.ratio_w + ':' + d.ratio_h + ')');
        }).catch(function () { _mfToast('Server unreachable'); });
      },
    };

    fetch('/blockly/blocks_data').then(function (r) { return r.json(); }).then(function (d) {
      (d.blocks || []).forEach(function (f) {
        try { (0, eval)(f.code); } catch (e) { /* block file broken — skip */ }
      });
      // pcr_image_from_res 1:1 — but the preview resolves via the macro
      // images dir (recorder paths), not a procedure workspace's resources.
      var imgDef = Blockly.Blocks['pcr_image_from_res'];
      if (imgDef) {
        imgDef.mfRefreshPreview = function () {
          if (this.isInFlyout || !this.rendered) return;
          this.mfPreviewTries = 0;
          var self = this;
          var path = self.mfPathText();
          if (!path) { self.mfSetPreviewField(MF_PLACEHOLDER_IMG, 120, 28); return; }
          var src = '/me/api/image_preview?path=' + encodeURIComponent(path) + '&v=' + Date.now();
          if (self.mfLastSrc === src) return;
          self.mfLastSrc = src;
          var probe = new Image();
          probe.onload = function () {
            var maxW = 120, maxH = 28;
            var scale = Math.min(maxW / probe.naturalWidth, maxH / probe.naturalHeight, 1);
            self.mfSetPreviewField(src, Math.max(8, Math.round(probe.naturalWidth * scale)),
                                          Math.max(8, Math.round(probe.naturalHeight * scale)));
          };
          probe.onerror = function () { self.mfSetPreviewField(MF_MISSING_IMG, 120, 28); };
          probe.src = src;
        };
      }
      startEditor();
    }).catch(function () { startEditor(); });
  })();
  </script>
</body>
</html>
