<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procedure Editor</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #0e0e12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #blocklyDiv { width: 100%; height: calc(100% - 44px); }

    /* Toolbar */
    .proc-toolbar {
      height: 44px; display: flex; align-items: center; gap: 12px;
      padding: 0 16px; background: #16161c; border-bottom: 1px solid #2a2a35;
    }
    .proc-toolbar-title {
      font-size: 14px; font-weight: 700; color: #f7a06a;
    }
    .proc-toolbar input {
      background: #0e0e12; border: 1px solid #2a2a35; border-radius: 6px;
      padding: 5px 10px; color: #e0e0e8; font-size: 12px; outline: none; width: 240px;
    }
    .proc-toolbar input:focus { border-color: #f7a06a; }
    .proc-toolbar .save-indicator {
      font-size: 11px; color: #7070a0; margin-left: auto;
    }
    .proc-toolbar .code-toggle {
      background: rgba(124,106,247,.15); border: 1px solid #7c6af7; color: #a0a0c0;
      border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-weight: 600;
    }
    .proc-toolbar .code-toggle:hover { background: rgba(124,106,247,.25); }

    /* Code preview panel */
    #codePanel {
      display: none; position: fixed; right: 0; top: 44px; bottom: 0; width: 420px;
      background: #0d0d14; border-left: 1px solid #2a2a35; z-index: 100;
    }
    #codePanel.open { display: flex; flex-direction: column; }
    #codePanel .code-header {
      padding: 10px 14px; border-bottom: 1px solid #2a2a35;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #7070a0;
    }
    #codePanel .code-body { flex: 1; overflow: auto; padding: 14px; }
    #codePanel pre {
      margin: 0; font-family: 'Consolas', 'Cascadia Code', monospace;
      font-size: 12px; color: #a0d0a0; white-space: pre-wrap; line-height: 1.6;
    }
    #codePanel .kw { color: #f7a06a; }
    #codePanel .str { color: #a0d0a0; }
    #codePanel .var { color: #6aa6f7; }
    #codePanel .cmt { color: #555; }
    #codePanel .num { color: #f76aa6; }

    /* Loading overlay */
    #loadingOverlay {
      position: absolute; top: 44px; left: 0; width: 100%; height: calc(100% - 44px);
      background: #0e0e12; display: flex; align-items: center; justify-content: center;
      z-index: 99999; transition: opacity 0.3s ease;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 44px; height: 44px; border: 3px solid #2a2a35;
      border-top-color: #f7a06a; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .loading-text {
      position: absolute; bottom: 38%; color: #7070a0; font-size: 13px; letter-spacing: 1px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dark scrollbars */
    ::-webkit-scrollbar { width: 7px; }
    .blocklyScrollbarBackground { opacity: 255; fill: transparent; }
    .blocklyMainBackground { stroke-width: 0; }
    .blocklyFlyoutBackground { fill-opacity: 0; }
    .blocklyScrollbarVertical .blocklyScrollbarHandle { rx: 2px; ry: 2px; width: 6px; }
    .blocklyScrollbarHorizontal .blocklyScrollbarHandle { rx: 2px; ry: 2px; height: 6px; }
    .blocklySelected > .blocklyPath { stroke-width: 2px; }
    .blocklyWidgetDiv .blocklyMenu { border-radius: 0; }
    .blocklyTreeLabel { font-size: 13px; }
    .blocklyToolboxCategory { line-height: 16px; }
    .blocklyToolboxCategoryLabel { font-size: 13px; font-family: inherit; }
    .blocklyTreeRow { line-height: 1 !important; }
    .small-text { font-size: 12px !important; }
    .condition-label { font-size: 13px !important; }
    .blocklyDropDownContent { position: relative; }
    .whlab > .blocklyFlyoutLabelText { font-size: 14px; }
  </style>
</head>
<body>

<div class="proc-toolbar">
  <span class="proc-toolbar-title">Procedure:</span>
  <input id="procName" value="Untitled" placeholder="Procedure name">
  <button class="code-toggle" onclick="toggleCodePanel()">&lt;/&gt; Code</button>
  <span class="save-indicator" id="saveIndicator">Ready</span>
</div>

<div id="blocklyDiv"></div>

<div id="codePanel">
  <div class="code-header">Generated Python Code</div>
  <div class="code-body"><pre id="codeOutput"></pre></div>
</div>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading blocks…</div>
</div>

<script src="lib/blockly.min.js"></script>
<script src="lib/python_compressed.js"></script>
<script src="lib/en.js"></script>

<script>
  var workspace = null;
  var saveTimer = null;
  var _meGlobalVars = {};
  var _meGlobalVarNames = {};
  var _meLocalVars = {};
  var _meCallableProcs = [];

  // Dark theme
  try {
    Blockly.utils.colour.setHsvSaturation(0.55);
    Blockly.utils.colour.setHsvValue(0.70);
  } catch (e) {}

  function buildDarkTheme() {
    try {
      var blockStyles = {
        "math_blocks":     { "colourPrimary": "230" },
        "text_blocks":     { "colourPrimary": "160" },
        "logic_blocks":    { "colourPrimary": "210" },
        "list_blocks":     { "colourPrimary": "260" },
        "loop_blocks":     { "colourPrimary": "120" },
        "variable_blocks": { "colourPrimary": "330" },
        "variable_dynamic_blocks": { "colourPrimary": "310" }
      };
      return new Blockly.Theme('me_dark', blockStyles, {}, {
        workspaceBackgroundColour: '#0e0e12',
        toolboxBackgroundColour: '#16161c',
        toolboxForegroundColour: '#e0e0e8',
        flyoutBackgroundColour: '#12121a',
        flyoutForegroundColour: '#e0e0e8',
        flyoutOpacity: 1,
        scrollbarColour: '#2a2a35',
        scrollbarOpacity: 0.9,
        insertionMarkerColour: '#f7a06a',
        insertionMarkerOpacity: 0.4,
        cursorColour: '#f7a06a'
      });
    } catch (e) { return undefined; }
  }

  function initBlockly() {
    if (typeof Blockly === 'undefined') { console.error("Blockly not loaded"); return false; }

    var toolbox = '<xml><category name="Loading..." colour="#ccc"></category></xml>';
    var injectOptions = {
      toolbox: toolbox,
      grid: { spacing: 20, length: 3, colour: '#1a1a25', snap: true },
      zoom: { controls: false, wheel: true, startScale: 0.9, maxScale: 2, minScale: 0.4, scaleSpeed: 1.2 },
      trashcan: true,
      move: { scrollbars: true, drag: true, wheel: false },
      renderer: 'thrasos',
      media: 'lib/media/'
    };

    var theme = buildDarkTheme();
    if (theme) injectOptions.theme = theme;

    workspace = Blockly.inject('blocklyDiv', injectOptions);

    workspace.addChangeListener(function(event) {
      if (event.type === Blockly.Events.UI) return;
      // Auto-save
      if (saveTimer) clearTimeout(saveTimer);
      var ind = document.getElementById('saveIndicator');
      if (ind) ind.textContent = 'Saving...';
      saveTimer = setTimeout(function() {
        saveToParent();
        updateCodePreview();
        if (ind) ind.textContent = 'Saved';
      }, 500);
    });

    window._blocklyReady = true;
    console.log("Blockly workspace initialized");
    return true;
  }

  window.hideLoadingOverlay = function() {
    var ov = document.getElementById('loadingOverlay');
    if (ov) { ov.classList.add('hidden'); setTimeout(function() { ov.style.display = 'none'; }, 350); }
  };

  // Hat block management
  function findHatBlock() {
    if (!workspace) return null;
    var top = workspace.getTopBlocks(false);
    for (var i = 0; i < top.length; i++) {
      if (top[i].type === 'me_procedure_hat') return top[i];
    }
    return null;
  }

  window.ensureHatBlock = function(eventType, interval) {
    if (!workspace) return;
    var hat = findHatBlock();
    if (!hat) {
      hat = workspace.newBlock('me_procedure_hat');
      hat.initSvg(); hat.render(); hat.moveBy(24, 24);
    }
    if (eventType) hat.setFieldValue(eventType, 'EVENT_TYPE');
    if (interval) hat.setFieldValue(String(interval), 'INTERVAL');
    if (hat.updateIntervalVisibility) hat.updateIntervalVisibility(hat.getFieldValue('EVENT_TYPE'));
  };

  // Block injection
  window.injectBlockFiles = function(filesJson) {
    var files;
    try { files = JSON.parse(filesJson); } catch (e) {
      console.error("injectBlockFiles: bad JSON: " + e);
      return JSON.stringify({ loaded: 0, failed: [{ name: "<payload>", error: String(e) }] });
    }
    var loaded = 0, failed = [];
    files.forEach(function(file) {
      try { (0, eval)(file.code); loaded++; }
      catch (e) { failed.push({ name: file.name, error: (e && e.message) ? e.message : String(e) }); }
    });
    if (failed.length) console.warn(failed.length + " block file(s) failed to load.");
    return JSON.stringify({ loaded: loaded, failed: failed });
  };

  window.setToolbox = function(xml) {
    if (workspace) {
      var dom = Blockly.utils.xml.textToDom(xml);
      workspace.updateToolbox(dom);
    }
  };

  // Workspace XML
  window.loadWorkspaceXml = function(xmlStr) {
    if (!workspace) return;
    try {
      workspace.clear();
      var dom = Blockly.utils.xml.textToDom(xmlStr);
      Blockly.Xml.domToWorkspace(dom, workspace);
      window.ensureHatBlock('on_call', 100);
    } catch (e) {
      console.error("Load error: " + e);
      window.ensureHatBlock('on_call', 100);
    }
  };

  window.getWorkspaceXml = function() {
    if (workspace) return Blockly.Xml.domToText(Blockly.Xml.workspaceToDom(workspace));
    return '<xml></xml>';
  };

  // Code generation
  window.generateCode = function() {
    if (!workspace) return "";
    try { return Blockly.Python.workspaceToCode(workspace); }
    catch (e) { console.error("Code gen error: " + e); return "# Error: " + e; }
  };

  // Variables sync
  window.syncVariables = function(varsJson) {
    if (!workspace) return;
    try {
      var vars = typeof varsJson === 'string' ? (varsJson.trim() ? JSON.parse(varsJson) : []) : varsJson;
      if (!Array.isArray(vars)) vars = [];
      _meGlobalVars = {};
      _meGlobalVarNames = {};
      vars.forEach(function(item) {
        var name = typeof item === 'string' ? item : item.name;
        var vtype = typeof item === 'string' ? 'text' : (item.type || 'text');
        if (!workspace.getVariable(name, '')) workspace.createVariable(name);
        _meGlobalVars[name] = vtype;
        _meGlobalVarNames[name] = true;
      });
    } catch (e) { console.error("syncVariables error: " + e); }
  };

  // Callable procs
  window.setCallableProcs = function(procs) {
    _meCallableProcs = Array.isArray(procs) ? procs : [];
  };

  // Code preview
  function updateCodePreview() {
    var code = window.generateCode();
    var pre = document.getElementById('codeOutput');
    if (!pre) return;
    var highlighted = code
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/\b(def|if|elif|else|for|while|in|range|pass|import|return|True|False|None|break|continue|try|except)\b/g, '<span class="kw">$1</span>')
      .replace(/#(.*)/g, '<span class="cmt">#$1</span>')
      .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
    pre.innerHTML = highlighted;
  }

  function toggleCodePanel() {
    var p = document.getElementById('codePanel');
    if (p.classList.contains('open')) {
      p.classList.remove('open');
    } else {
      p.classList.add('open');
      updateCodePreview();
    }
  }

  // === Save to parent window via postMessage ===
  function saveToParent() {
    if (!workspace) return;
    var xml = window.getWorkspaceXml();
    var code = window.generateCode();
    var name = document.getElementById('procName').value || 'Untitled';
    var msg = {
      type: 'proc_save',
      procId: window._procId,
      procName: name,
      xml: xml,
      code: code
    };
    try {
      window.parent.postMessage(msg, '*');
    } catch(e) { console.error('postMessage failed:', e); }
  }

  // Name change auto-save
  document.getElementById('procName').addEventListener('input', function() {
    if (saveTimer) clearTimeout(saveTimer);
    var ind = document.getElementById('saveIndicator');
    if (ind) ind.textContent = 'Saving...';
    saveTimer = setTimeout(function() {
      saveToParent();
      if (ind) ind.textContent = 'Saved';
    }, 500);
  });

  // Handle messages from parent
  window.addEventListener('message', function(event) {
    var msg = event.data;
    if (!msg || !msg.type) return;
    if (msg.type === 'proc_init') {
      window._procId = msg.procId;
      document.getElementById('procName').value = msg.procName || 'Untitled';
      // Inject blocks
      if (msg.blockFiles) {
        var result = window.injectBlockFiles(JSON.stringify(msg.blockFiles));
        window.setToolbox(msg.toolboxXml || '<xml></xml>');
      }
      // Sync variables
      if (msg.variables) window.syncVariables(JSON.stringify(msg.variables));
      if (msg.config) window.syncVariables(JSON.stringify(msg.config));
      // Callable procs
      if (msg.callableProcs) window.setCallableProcs(msg.callableProcs);
      // Load existing XML or create hat block
      if (msg.xml) {
        window.loadWorkspaceXml(msg.xml);
      } else {
        window.ensureHatBlock('on_call', 100);
      }
      window.hideLoadingOverlay();
      updateCodePreview();
    }
    if (msg.type === 'proc_update_vars') {
      if (msg.variables) window.syncVariables(JSON.stringify(msg.variables));
      if (msg.config) window.syncVariables(JSON.stringify(msg.config));
    }
  });

  // Tell parent we're ready
  window.addEventListener('load', function() {
    try {
      window.parent.postMessage({ type: 'proc_editor_ready' }, '*');
    } catch(e) { console.error('ready signal failed:', e); }
    if (typeof Blockly !== 'undefined') { initBlockly(); }
    else {
      var attempts = 0;
      var checkInterval = setInterval(function() {
        attempts++;
        if (typeof Blockly !== 'undefined') { clearInterval(checkInterval); initBlockly(); }
        else if (attempts > 50) { clearInterval(checkInterval); console.error("Blockly failed to load"); }
      }, 100);
    }
  });

  // Save before closing
  window.addEventListener('beforeunload', function() {
    saveToParent();
  });
</script>
</body>
</html>
